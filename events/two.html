<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="name">Basic async</h1>
    <button id="stop">Stop</button>
</body>
<script>

    // setTimeout(
    //     function(){
    //         console.log("Shashank Soni")
    //     },
    //     2000 // time is in millisecs so 2000ms = 2s
    // )

    const sayMyName = function(){
        console.log("Shashank Soni");
    }

    // setTimeout(sayMyName, 2000)

    // setInterval(sayMyName, 2000)

    const changeName = function(){
        document.querySelector('h1').innerHTML = "Nikhil Soni"
    }

    const changeMe = setTimeout(changeName, 2000);

    document.getElementById('stop').addEventListener(
        'click',
        function(){
            clearTimeout(changeMe);
            console.log("Change name prevented");
        }
    )

</script>
</html>
