<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Interesting</h1>
    <button id="start">start</button>
    <button id="stop">stop</button>
</body>
<script>

    const printThis = function(str){
        console.log('hiii', Date.now(), str)
    }

    let startprinting; // declare this variable here so that its scope is global

    document.getElementById('start').addEventListener(
        'click',
        function(){
            startprinting = setInterval(printThis, 1000, 'hello'); // if you directly initialize it here, its scope will only be limited to this function
        }
    )

    document.getElementById('stop').addEventListener(
        'click',
        function(){
            clearInterval(startprinting);
        }
    )

</script>
</html>
